<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="header-inner">
    <div>
      <div class="store-name" id="storeName">Mi Tienda</div>
      <div class="store-tagline" id="storeTagline">Pedí fácil, recibí rápido</div>
    </div>
    <button class="cart-btn" onclick="openCart()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/>
      </svg>
      Carrito
      <span class="cart-count" id="cartCount">0</span>
    </button>
  </div>
</header>

<!-- ===== HERO ===== -->
<div class="hero">
  <div class="hero-eyebrow">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
    Tienda Online
  </div>
  <h1 id="heroTitle">¡Bienvenido!</h1>
  <p id="heroSubtitle">Elegí tus productos y recibís el pedido por WhatsApp</p>
</div>

<!-- ===== MAIN ===== -->
<main>
  <div id="errorBanner" style="display:none"></div>
  <div id="loadingState" class="loading-state">
    <div class="spinner"></div>
    <p>Cargando productos...</p>
  </div>
  <div id="storeContent" style="display:none">
    <div class="controls-bar">
      <div class="categories" id="categoriesBar"></div>
      <div class="last-updated">
        Actualizado: <span id="lastUpdated">—</span>
        <button class="refresh-btn" onclick="loadProducts()">↻ Actualizar</button>
      </div>
    </div>
    <div class="products-grid" id="productsGrid"></div>
  </div>
</main>

<!-- ===== CART MODAL ===== -->
<div class="modal-overlay" id="cartModal" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-drag-handle"></div>
    <div class="modal-header">
      <span class="modal-title">Tu pedido</span>
      <button class="close-btn" onclick="closeCart()">✕</button>
    </div>

    <div id="cartItems"></div>

    <div class="checkout-form" id="checkoutForm" style="display:none">
      <div class="form-section-label">Datos de contacto</div>
      <div class="form-row">
        <div class="form-group">
          <label>Tu nombre *</label>
          <input type="text" id="clientName" placeholder="Ej: María García">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="text" id="clientPhone" placeholder="351 123-4567">
        </div>
      </div>

      <div class="form-section-label" style="margin-top:0.6rem">Entrega y pago</div>
      <div class="form-row">
        <div class="form-group">
          <label>Forma de entrega *</label>
          <select id="deliveryMethod">
            <option value="retiro">Retiro en local</option>
            <option value="envio">Envío a domicilio</option>
          </select>
        </div>
        <div class="form-group">
          <label>Forma de pago *</label>
          <select id="paymentMethod">
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </div>
      </div>

      <div class="form-group" id="addressGroup" style="display:none">
        <label>Dirección de envío</label>
        <input type="text" id="clientAddress" placeholder="Calle, número, piso">
      </div>

      <div class="form-group">
        <label>Notas adicionales</label>
        <textarea id="notes" placeholder="Aclaraciones, horarios, referencias, etc."></textarea>
      </div>

      <button class="whatsapp-btn" onclick="sendToWhatsApp()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Enviar pedido por WhatsApp
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="index.js"></script>

</body>
</html>
